# PROJECT ----------------------------------------------------------------------
[project]
name = "fastapi-app"
version = "0.1.0"
description = "Production-ready FastAPI application template"
authors = [{ name = "Igor Lashkov", email = "rwrotson@yandex.ru" }]
maintainers = []
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
keywords = ["fastapi", "template", "api", "uv", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.143.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
]

[project.urls]
Repository = "https://github.com/rwrotson/fastapi-template"
Documentation = "https://rwrotson.github.io/fastapi-template"
Changelog = "https://github.com/rwrotson/fastapi-template/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres-raw = [
    "psycopg[binary,pool]>=3.3.6",
]
postgres-orm = [
    "sqlalchemy[asyncio]>=2.1.4",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
]
clickhouse = [
    "clickhouse-connect[async]>=1.10.0",
]
mongodb = [
    "pymongo>=4.18.3",
]
redis = [
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-randomly>=5.0.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.6",
    "properdocs>=1.6.7",
]


# BUILD BACKEND ----------------------------------------------------------------
[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Security floors for transitive dependencies.
constraint-dependencies = [
    "certifi>=2026.10.18",
    "dnspython>=2.9.2",
    "filelock>=4.2.1",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.10",
]

[tool.uv.build-backend]
module-name = "app"
module-root = "src"


# PYTEST -----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# xdist workers talk to the controller over Unix sockets, so those stay allowed.
addopts = "-ra --tb=short --strict-markers --strict-config -n auto --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
timeout = 30

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]
branch = true
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95


# MYPY -------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "migrations", "docs"]
exclude_gitignore = true
strict = true
disallow_any_unimported = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


# RUFF -------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "ANN",
    "S",
    "RUF",
    "TID",
    "FAST",
    "C4",
    "SIM",
    "PT",
    "RET",
    "ARG",
    "PERF",
    "FURB",
    "PL",
    "DTZ",
    "T20",
    "ERA",
    "BLE",
    "N",
    "PIE",
    "D101",
    "D102",
    "D103",
    "PGH003",
    "PGH004",
    "T100",
    "C901",
    "FBT003",
    "A001",
    "A002",
    "A004",
    "A005",
    "A006",
    "G001",
    "G002",
    "G003",
    "G004",
    "G101",
    "G201",
    "G202",
    "LOG001",
    "LOG002",
    "LOG014",
    "LOG015"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",
    "ARG",
    "S101",
    "S105",
    "S106",
    "D101",
    "D102",
    "D103"
]
"migrations/**" = ["ERA"]
"docs/**" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"


# COMMITIZEN -------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true


# IMPORT-LINTER ----------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services stay independent of transport, storage and configuration"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic_settings",
    "sqlalchemy",
    "psycopg",
    "psycopg_pool",
    "redis",
    "pymongo",
    "clickhouse_connect",
    "app.api",
    "app.infra",
    "app.core",
    "app.config",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on HTTP"
type = "forbidden"
source_modules = ["app.infra"]
forbidden_modules = ["fastapi", "starlette", "app.api"]

[[tool.importlinter.contracts]]
name = "Configuration has no application dependencies"
type = "forbidden"
source_modules = ["app.config"]
forbidden_modules = ["app.api", "app.infra", "app.services", "app.core"]

[[tool.importlinter.contracts]]
name = "Operational support does not depend on business or HTTP layers"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.services", "app.infra"]

[[tool.importlinter.contracts]]
name = "Application layers"
type = "layers"
containers = ["app"]
layers = ["main", "api", "container", "infra", "services | core | config"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Service modules layers"
type = "layers"
containers = ["app.services"]
layers = ["notes | greeting", "errors"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "API modules layers"
type = "layers"
containers = ["app.api"]
layers = ["v1 | health", "dependencies | errors"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "API dependency providers layers"
type = "layers"
containers = ["app.api.dependencies"]
layers = ["config | notes", "storage", "container"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "API v1 routers are independent"
type = "layers"
containers = ["app.api.v1"]
layers = ["auth | examples | notes"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Operational support modules layers"
type = "layers"
containers = ["app.core"]
layers = ["middleware", "logging | metrics | problems | telemetry"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Storage modules layers"
type = "layers"
containers = ["app.infra.storage"]
layers = ["clickhouse | mongodb | notes | postgres_orm | postgres_raw | redis", "base | models"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Transitive dependencies are not imported directly"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = [
    "aiohappyeyeballs",
    "aiohttp",
    "aiosignal",
    "annotated_doc",
    "annotated_types",
    "anyio",
    "argcomplete",
    "asgiref",
    "ast_serialize",
    "attr",
    "attrs",
    "babel",
    "backrefs",
    "certifi",
    "cfgv",
    "charset_normalizer",
    "click",
    "colorama",
    "coverage",
    "csscompressor",
    "dateutil",
    "decli",
    "deprecated",
    "distlib",
    "dns",
    "dotenv",
    "execnet",
    "filelock",
    "frozenlist",
    "ghp_import",
    "google",
    "greenlet",
    "griffe",
    "grimp",
    "h11",
    "htmlmin",
    "httpcore2",
    "identify",
    "idna",
    "iniconfig",
    "jinja2",
    "jsmin",
    "librt",
    "lz4",
    "mako",
    "markdown",
    "markdown_it",
    "markupsafe",
    "mdurl",
    "mergedeep",
    "mkdocs",
    "mkdocs_autorefs",
    "mkdocs_get_deps",
    "mkdocstrings_handlers",
    "multidict",
    "mypy_extensions",
    "nodeenv",
    "packaging",
    "paginate",
    "pastel",
    "pathspec",
    "platformdirs",
    "pluggy",
    "prompt_toolkit",
    "propcache",
    "pydantic_core",
    "pygments",
    "pymdownx",
    "python_discovery",
    "questionary",
    "requests",
    "rich",
    "six",
    "termcolor",
    "tomlkit",
    "truststore",
    "typing_extensions",
    "typing_inspection",
    "urllib3",
    "virtualenv",
    "watchdog",
    "wcwidth",
    "wrapt",
    "yaml",
    "yaml_env_tag",
    "yarl",
]
# Direct dependencies import them internally.
allow_indirect_imports = true


# POETHEPOET -------------------------------------------------------------------
[tool.poe.tasks]
serve = "uvicorn app.main:create_app --factory --reload --no-access-log"
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check ."
lint-imports = "lint-imports"
typecheck = "mypy"
test = "pytest --cov"
test-fast = "pytest"
migrate = "alembic upgrade head"
docs = "properdocs serve"
quick = ["lint", "lint-imports", "typecheck"]
check = ["fmt-check", "lint", "lint-imports", "typecheck", "test"]

[tool.poe.tasks.test-live]
cmd = "pytest tests/integration --live -n 0 -p no:randomly"
envfile = { optional = [".env"] }

[tool.poe.tasks.audit]
shell = """
uv export --quiet --format requirements-txt --all-groups --all-extras --locked --no-emit-project --no-hashes --output-file requirements-audit.txt
uv run --locked --with pip-audit pip-audit --requirement requirements-audit.txt --no-deps
"""
