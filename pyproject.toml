[project]
name = "fastapi-app"
version = "0.1.0"
description = "Production-ready FastAPI application template"
authors = [{ name = "Igor Lashkov", email = "rwrotson@yandex.ru" }]
readme = "README.md"
requires-python = ">=3.14"
keywords = ["fastapi", "template", "api", "uv", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.123",
    "starlette>=1.2.1",  # First release whose test client uses httpx2.
    "uvicorn>=0.34",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.8",
    "structlog>=25",
    "prometheus-client>=0.22",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[project.optional-dependencies]
postgres-raw = ["psycopg[binary,pool]>=3.2.10"]
postgres-orm = ["sqlalchemy[asyncio]>=2.0.45", "psycopg[binary]>=3.2.10", "alembic>=1.15"]
clickhouse = ["clickhouse-connect[async]>=1.0"]
mongodb = ["pymongo>=4.15.2"]
redis = ["redis>=6"]

[dependency-groups]
dev = [
    "commitizen>=4.16",
    "httpx2>=2.13",
    "import-linter>=2.3",
    "mypy>=1.15",
    "poethepoet>=0.34",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-asyncio>=1.0",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "ruff>=0.15",
]
docs = [
    "mkdocs-gen-files>=0.6",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8",
    "mkdocstrings[python]>=0.29",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv]
# Security floors for transitive dependencies.
constraint-dependencies = ["urllib3>=2.8.0", "virtualenv>=21.7.13"]

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short --strict-markers --strict-config"
markers = ["integration: requires a migrated PostgreSQL database"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
timeout = 30

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests", "migrations", "docs"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "ASYNC", "ANN", "S", "RUF", "TID",
    "FAST", "C4", "SIM", "PT", "RET", "ARG", "PERF", "FURB", "PL", "DTZ",
    "T20", "ERA", "BLE", "N", "PIE",
]
ignore = ["S101", "ANN201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG", "S105", "S106"]
"migrations/**" = ["ERA"]
"docs/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services stay independent of transport, storage and configuration"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "fastapi", "starlette", "pydantic_settings", "sqlalchemy", "psycopg", "psycopg_pool",
    "redis", "pymongo", "clickhouse_connect", "app.api", "app.infra", "app.core", "app.config",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on HTTP"
type = "forbidden"
source_modules = ["app.infra"]
forbidden_modules = ["fastapi", "starlette", "app.api"]

[[tool.importlinter.contracts]]
name = "Configuration has no application dependencies"
type = "forbidden"
source_modules = ["app.config"]
forbidden_modules = ["app.api", "app.infra", "app.services", "app.core"]

[[tool.importlinter.contracts]]
name = "Operational support does not depend on business or HTTP layers"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.services", "app.infra"]

[tool.poe.tasks]
serve = "uvicorn app.main:create_app --factory --reload --no-access-log"
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check ."
lint-imports = "lint-imports"
typecheck = "mypy"
test = "pytest --cov=app"
test-fast = "pytest"
test-integration = "pytest --no-cov -m integration"
migrate = "alembic upgrade head"
docs = "mkdocs serve"
check = ["fmt-check", "lint", "lint-imports", "typecheck", "test"]

[tool.poe.tasks.audit]
shell = """
uv export --locked --all-extras --no-dev --no-emit-project --no-hashes --output-file requirements-audit.txt
uv run --with pip-audit pip-audit --requirement requirements-audit.txt --no-deps
"""
